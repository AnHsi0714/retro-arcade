<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Arcade</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
      }
      #error {
        position: fixed;
        inset: auto 0 0 0;
        padding: 8px 12px;
        font: 14px monospace;
        color: #fff;
        background: #a01818;
        white-space: pre-wrap;
        display: none;
      }

      /* on-screen controls, added by src/engine/touch.ts on touch devices only */
      body.touch {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .touch-pad,
      .touch-btn {
        position: absolute;
        pointer-events: auto;
        touch-action: none;
        color: #f4f4f4;
        font-family: monospace;
        font-weight: bold;
      }
      .touch-pad {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: 138px;
        height: 138px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(244, 244, 244, 0.6);
      }
      .touch-pad span {
        position: absolute;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        border-radius: 8px;
      }
      .touch-pad .up { left: 47px; top: 4px; }
      .touch-pad .down { left: 47px; bottom: 4px; }
      .touch-pad .left { left: 4px; top: 47px; }
      .touch-pad .right { right: 4px; top: 47px; }
      .touch-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(244, 244, 244, 0.6);
      }
      .touch-a {
        right: max(24px, env(safe-area-inset-right));
        bottom: max(36px, env(safe-area-inset-bottom));
        width: 84px;
        height: 84px;
        border-radius: 50%;
        font-size: 28px;
      }
      .touch-pause {
        right: max(16px, env(safe-area-inset-right));
        top: max(16px, env(safe-area-inset-top));
        width: 52px;
        height: 44px;
        border-radius: 10px;
        font-size: 16px;
      }
      .touch-pad span.on,
      .touch-btn.on {
        background: rgba(255, 255, 255, 0.35);
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
